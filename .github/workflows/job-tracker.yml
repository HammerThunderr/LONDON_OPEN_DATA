# Place this file at: .github/workflows/job-tracker.yml
name: UK Job Market Tracker

on:
  # Monthly, not weekly. Adzuna's salary series is month-keyed, so weekly
  # runs collected near-identical data 51 weeks out of 52 and filled
  # history.json with duplicates. Vacancy counts do change week to week,
  # but monthly is the sensible cadence for both signals together.
  schedule:
    - cron: '0 6 2 * *'  # 06:00 UTC on the 2nd of each month
  workflow_dispatch: {}   # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run tracker
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scrapers/adzuna_uk_tracker.py

      - name: Run trend analysis
        run: python scrapers/analyze_trends.py

      - name: Commit updated data
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Job market snapshot $(date -u +%Y-%m-%d)"
          git push
